[package]
name = "rdrs-e2e"
version = "0.0.0"
edition = "2024"
publish = false
description = "Browser E2E tests and screenshot pipeline for rdrs"

# Deliberately its own workspace, not a member of the one at the repository
# root. CI runs coverage as `cargo llvm-cov nextest --workspace`, which would
# otherwise compile thirtyfour and drive a real browser on every coverage run.
# `e2e/` was already a self-contained sub-project when it was JavaScript; this
# keeps that boundary.
[workspace]

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
# CDP takes a fulfilled response's body base64-encoded.
base64 = "0.23"
cucumber = "0.23.0"
# For `StreamExt::next` over thirtyfour's CDP event streams.
futures-util = { version = "0.3", default-features = false }
percent-encoding = "2.3"
rand = "0.10"
regex = "1.12"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "charset",
  "json",
] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
] }
tempfile = "3.26.0"
# Pinned exactly: 0.37.5 was published 2026-08-12, inside the seven-day cooldown
# this project applies to fresh releases. Relax to a caret once it has aged out.
#
# `cdp-events` is what makes request interception possible: it opens a WebSocket
# to the browser so `Fetch.requestPaused` can be *received*, not just commands
# sent. That is Playwright's `page.route` — the no-JS walkthrough aborts every
# script request through it, and the stale-response scenarios hold one response
# back. Deliberately **not** `bidi`: `Emulation.setScriptExecutionDisabled` and
# `Emulation.setEmulatedMedia` have no BiDi equivalent, so CDP is required
# regardless and a second protocol stack would buy nothing.
thirtyfour = { version = "=0.37.4", features = ["cdp-events"] }
tokio = { version = "1.53.1", features = [
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }

[[test]]
name = "e2e"
harness = false

# Hyphenated names for the audits, so the commands read the way the old npm
# scripts did (`npm run test:csp` → `cargo run --bin csp-audit`).
[[bin]]
name = "csp-audit"
path = "src/bin/csp_audit.rs"

[[bin]]
name = "nojs"
path = "src/bin/nojs.rs"

[[bin]]
name = "touch-audit"
path = "src/bin/touch_audit.rs"

[[bin]]
name = "dom-bench"
path = "src/bin/dom_bench.rs"

# Mirrors the root crate's lint set, minus the entries that only apply to the
# server. Being a separate workspace means none of it is inherited, and test
# code that lints differently from the code it tests drifts.
[lints.rust]
unexpected_cfgs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

cast_possible_truncation = "allow"
cast_precision_loss = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
too_many_lines = "allow"

dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
