# cargo-deny configuration — supply-chain checks for the dependency graph.
# Run locally with `cargo deny check`; CI runs the same on every push and PR.

[graph]
# Check the dependency graph for all targets, not just the host's, so a
# platform-specific dependency can't smuggle in a bad license or advisory.
all-features = true

[advisories]
version = 2
# Deny crates with a known security advisory (RUSTSEC) or that have been yanked.
# `ignore` holds advisory IDs we've reviewed and consciously accept; each entry
# records why it is safe here and what would let us drop it.
yanked = "deny"
ignore = [
    # ammonia 4.2.0: only affects callers that allow `style` and use
    # `filter_style_properties`; neither is used in src/services/sanitize.rs.
    # Fix 4.2.3 is inside the 168h cooldown until 2026-10-18 06:27 UTC.
    # Drop once ammonia is upgraded. Tracked in
    # https://github.com/henry40408/rdrs/issues/591
    "RUSTSEC-2021-0157",
    # ammonia 4.2.0: SVG `animateMotion`/`animateTransform`/`animateColor`
    # bypass attribute URL filtering, but only when the caller explicitly
    # allows those tags (none are allowed by default). sanitize.rs sets
    # `.tags(...)` to fixed whitelists (sanitize_html, SUMMARY_TAGS) that
    # contain no `svg` or `animate*` element, so this is not reachable.
    # Fix 4.2.3 (or 4.1.7) was published 2026-10-11 and is inside the 168h
    # cooldown until 2026-10-18 06:27 UTC. Drop together with 0157 once
    # ammonia is upgraded. Tracked in
    # https://github.com/henry40408/rdrs/issues/591
    "RUSTSEC-2021-0158",
]

[licenses]
version = 2
# Permissive / public-domain-equivalent licenses only. Verify the active set
# with `cargo deny list`; add a license here only after reviewing the crate.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # Weak (file-level) copyleft, pulled in by webauthn-rs (passkey auth) and
    # the scraper/cssparser/selectors HTML stack — both real runtime deps.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Duplicate transitive versions are common; surface them as a warning, not a
# hard failure.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io is trusted; an unknown registry or any git source is rejected.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
