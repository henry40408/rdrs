# cargo-deny configuration — supply-chain checks for the dependency graph.
# Run locally with `cargo deny check`; CI runs the same on every push and PR.

[graph]
# Check the dependency graph for all targets, not just the host's, so a
# platform-specific dependency can't smuggle in a bad license or advisory.
all-features = true

[advisories]
version = 2
# Deny crates with a known security advisory (RUSTSEC) or that have been yanked.
# `ignore` holds advisory IDs we've reviewed and consciously accept (none yet).
yanked = "deny"
ignore = [
    # core2 is unmaintained and all versions are yanked; pulled in transitively
    # with no maintained drop-in replacement available yet. The crate spec
    # silences the separate `yanked = "deny"` check for the same crate.
    "RUSTSEC-2026-0105",
    "core2@0.4.0",
    # paste (proc-macro helper) is no longer maintained; still pulled in
    # transitively, no maintained replacement wired up.
    "RUSTSEC-2024-0436",
    # memmap2 unchecked pointer offset (unsound). Fixed in 0.9.11, but that
    # release is younger than our 7-day dependency cooldown — re-bump and drop
    # this entry once it has aged out.
    "RUSTSEC-2026-0186",
    # quick-xml DoS advisories (quadratic duplicate-attribute check; unbounded
    # namespace allocation in NsReader), exploitable only via malicious feed
    # XML. Sole fix is 0.41.0 (published 2026-06-29, inside the 7-day
    # cooldown). Two copies in the tree: our direct 0.40 dep — bump to 0.41
    # after 2026-07-06 — and feed-rs 2.3.1's pinned 0.37, which stays until
    # upstream releases against 0.41. Drop these once both paths are clean.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # ttf-parser (RUSTSEC-2026-0192) and rustybuzz (RUSTSEC-2026-0206) are both
    # unmaintained, pulled in transitively via the same resvg/usvg text stack we
    # use only as a build-dependency for favicon rendering. Neither has a
    # maintained fix — ttf-parser 0.25.1 and rustybuzz 0.20.1 are the latest
    # releases and resvg 0.47.0 (our current, latest) still pins them — so they
    # can't be cleared by a version bump; revisit when the resvg chain drops or
    # replaces them. Tracked in issue #346 (the ammonia/anyhow entries there are
    # now resolved).
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0206",
    # crossbeam-epoch invalid pointer deref in the `fmt::Display`/`fmt::Pointer`
    # impls for `Atomic`/`Shared` on a null pointer (transitive via image and
    # moka; we never format those pointers, so it's unreachable here). Sole fix
    # is 0.9.20, published 2026-07-06 — inside the 7-day cooldown. Tracked in the
    # follow-up issue: bump with `cargo update -p crossbeam-epoch` and drop this
    # entry once 0.9.20 has aged past the cooldown (from 2026-07-13).
    "RUSTSEC-2026-0204",
]

[licenses]
version = 2
# Permissive / public-domain-equivalent licenses only. Verify the active set
# with `cargo deny list`; add a license here only after reviewing the crate.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # Weak (file-level) copyleft, pulled in by webauthn-rs (passkey auth) and
    # the scraper/cssparser/selectors HTML stack — both real runtime deps.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

# libfuzzer-sys is only reachable via `all-features`; allow its NCSA arm just
# for that crate rather than widening the global allowlist for a fuzz-only dep.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
# Duplicate transitive versions are common; surface them as a warning, not a
# hard failure.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io is trusted; an unknown registry or any git source is rejected.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
