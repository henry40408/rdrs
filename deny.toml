# cargo-deny configuration — supply-chain checks for the dependency graph.
# Run locally with `cargo deny check`; CI runs the same on every push and PR.

[graph]
# Check the dependency graph for all targets, not just the host's, so a
# platform-specific dependency can't smuggle in a bad license or advisory.
all-features = true

[advisories]
version = 2
# Deny crates with a known security advisory (RUSTSEC) or that have been yanked.
# `ignore` holds advisory IDs we've reviewed and consciously accept; each entry
# records why it is safe here and what would let us drop it.
yanked = "deny"
ignore = [
    # ctutils 0.4.0 (transitive via digest -> argon2/hmac/sha2): `Choice` mask
    # generation and `u128` comparisons may branch. rdrs never calls
    # `ctutils::Choice`. Fix 0.4.4 was published 2026-10-23 01:04 UTC and is
    # inside the 168h cooldown until 2026-10-30 01:04 UTC. Remove when upgraded.
    # Tracked in https://github.com/henry40408/rdrs/issues/668
    "RUSTSEC-2026-0385",
    # basic-toml 0.1.10 is unmaintained (repo archived). Reached only through
    # askama_derive, a compile-time proc-macro; it is not linked into the binary.
    # No patched version exists, so there is no cooldown date. Drop once an
    # askama_derive release stops depending on basic-toml (upstream:
    # https://github.com/askama-rs/askama/issues/594).
    # Tracked in https://github.com/henry40408/rdrs/issues/625
    "RUSTSEC-2026-0374",
]

[licenses]
version = 2
# Permissive / public-domain-equivalent licenses only. Verify the active set
# with `cargo deny list`; add a license here only after reviewing the crate.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # Weak (file-level) copyleft, pulled in by webauthn-rs (passkey auth) and
    # the scraper/cssparser/selectors HTML stack — both real runtime deps.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Duplicate transitive versions are common; surface them as a warning, not a
# hard failure.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io is trusted; an unknown registry or any git source is rejected.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
