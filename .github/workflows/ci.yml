name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref at a time — a newer push supersedes the run it interrupted.
# No tag carve-out here (unlike Docker, which publishes on `v*`): this workflow
# has no tag trigger, so `github.ref` is never a tag and the guard was dead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fmt + clippy on Linux. Runs in parallel with everything else — no gating.
  # GitHub Actions caches aren't shared across jobs, so a "lint gate" can't hand
  # its compiled artifacts to downstream jobs; it would only serialize a second
  # compile onto the critical path for no wall-clock win. And the cheap checks
  # (fmt, deny) don't validate compilation anyway, so they make poor fail-fast
  # gates for a Rust project. Full parallelism is simplest and fastest.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # clippy compiles, and build.rs runs git describe

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  lint-e2e:
    name: lint-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: e2e

      # `e2e/` is deliberately its own workspace (so a `--workspace` coverage
      # run never compiles thirtyfour or drives a browser), which also means
      # `--all` in the lint job does not reach it. Lint it explicitly, or the
      # suite is the one part of the tree nothing checks.
      - name: Check E2E formatting
        working-directory: e2e
        run: cargo fmt --all -- --check

      - name: Run clippy on the E2E suite
        working-directory: e2e
        run: cargo clippy --all-targets -- -D warnings

  # Cross-platform build / portability check (build-only; fmt + clippy live in
  # the lint and lint-e2e jobs). macOS is a portability sanity check; RDRS
  # deploys to Linux servers. (Windows was dropped earlier: 5-9 min per PR for no deployment
  # value.)
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Fetch full history for git describe

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --verbose

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-deny@0.18.9
      - name: cargo deny check
        run: cargo deny check

  # Unit and SQLite-backed tests. The Postgres test is excluded here because it
  # needs a database; the `integration` job runs it.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: nextest

      - name: Run tests
        env:
          RDRS_FAST_HASH: "1"
        run: cargo nextest run -E 'not binary(postgres_test)'

      # nextest does not run doctests.
      - name: Run doctests
        run: cargo test --doc

  # PostgreSQL backend integration test. The default nextest run (test/coverage)
  # only exercises the SQLite backend; this job stands up a throwaway Postgres
  # and runs the dual-backend dialect-fork test (`tests/postgres_test.rs`)
  # against it. Gated by TEST_DATABASE_URL — without it the test skips.
  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rdrs
          POSTGRES_PASSWORD: rdrs
          POSTGRES_DB: rdrs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rdrs -d rdrs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: nextest

      - name: Run Postgres integration test
        env:
          RDRS_FAST_HASH: "1"
          TEST_DATABASE_URL: postgres://rdrs:rdrs@localhost:5432/rdrs
        run: cargo nextest run --test postgres_test

  # The browser suite: cucumber + thirtyfour, driving a real Chrome. Split in
  # two so sharding does not pay for the Rust build once per shard (what made the
  # old Playwright shards a net loss): `e2e-build` compiles everything once and
  # hands the binaries to the shards, which only run them. The harness reuses
  # `target/debug/rdrs` when it exists, and `CARGO_MANIFEST_DIR` is baked into
  # the test binaries, so the shards must check out to the same path as this job
  # (they do: same repo, same runner image).
  e2e-build:
    name: e2e-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `e2e/` is its own workspace, so it has to be named separately or
          # its dependencies (thirtyfour, cucumber) are rebuilt every run. The
          # explicit key keeps this job's cache apart from `lint`'s, which
          # compiles a different set of crates.
          workspaces: |
            .
            e2e
          key: e2e

      - name: Build binary
        run: cargo build

      # The retry helpers in `src/wait.rs` carry unit tests that need no
      # browser; they run here because the shards only execute the cucumber
      # binary.
      - name: Run E2E unit tests
        working-directory: e2e
        run: cargo test --lib

      # `--message-format=json` names the test binary; its path ends in a hash.
      # Packed with tar because upload-artifact drops the executable bit.
      - name: Build the e2e binaries
        run: |
          binary=$(cd e2e && cargo test --test e2e --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "e2e") | .executable')
          test -x "$binary"
          cp "$binary" e2e/e2e-test
          (cd e2e && cargo build --bin csp-audit --bin nojs)
          cp e2e/target/debug/csp-audit e2e/target/debug/nojs e2e/
          tar -cf e2e-bundle.tar target/debug/rdrs e2e/e2e-test e2e/csp-audit e2e/nojs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-bundle
          path: e2e-bundle.tar
          retention-days: 7
          if-no-files-found: error

  # Scenarios are split by hash (see `e2e/tests/e2e/shard.rs`), and each shard
  # still runs its share concurrently, sized to the cores. A shard that selects
  # no scenarios fails, so a bad split cannot pass by skipping tests.
  e2e:
    name: e2e (${{ matrix.shard }})
    needs: e2e-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-bundle

      - name: Unpack the binaries
        run: tar -xf e2e-bundle.tar

      # `WebDriver::managed` downloads a chromedriver matching the browser on
      # the runner. `ubuntu-latest` already ships Chrome, so only the driver is
      # fetched — this is the replacement for the old ~/.cache/ms-playwright.
      # A miss just re-downloads it, so the key does not have to be exact.
      - name: Cache the browser driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/thirtyfour
          key: ${{ runner.os }}-chromedriver-${{ hashFiles('e2e/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-chromedriver-

      - name: Run E2E tests
        working-directory: e2e
        env:
          RDRS_E2E_SHARD: ${{ matrix.shard }}
        run: ./e2e-test

      # Browser-level CSP check. It runs in the first shard, which already has
      # the binaries and the driver, so it needs no job of its own for a ~10s
      # audit.
      #
      # This complements, not duplicates, the static scan in
      # `src/middleware/security_headers.rs`: that one greps the sources for
      # inline styles and handlers, while this one enforces the policy the
      # browser actually applies (runtime-injected markup, shadow DOM,
      # webfonts, cross-origin @import). It carries its own positive control,
      # so a pass means the collector was demonstrably live.
      - name: CSP audit
        if: matrix.shard == '1/3'
        working-directory: e2e
        run: ./csp-audit

      # Rides on the first shard for the same reason as the CSP audit above.
      #
      # The Rust suite (`tests/no_js_test.rs`) covers the scriptless paths from
      # the server's side; this is the only check that runs a browser with
      # scripting actually disabled *and* every `*.js` request aborted. That
      # distinction is not academic — it is what caught sign-out being
      # unreachable without JavaScript (#489), a `fetch` DELETE no form could
      # ever send, which every server-side test had happily passed around.
      - name: No-JavaScript walkthrough
        if: matrix.shard == '1/3'
        working-directory: e2e
        run: ./nojs

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # cargo-llvm-cov installs the llvm-tools-preview component itself, so the
      # toolchain needs no extra declaration beyond rust-toolchain.toml.

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-llvm-cov

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: nextest

      - name: Generate coverage
        # RDRS_FAST_HASH swaps Argon2 to minimal cost params for this run only.
        # The integration tests register/log in hundreds of times; with the
        # production (memory-hard) params each hash costs ~hundreds of ms in a
        # debug build, dominating the suite. Never set in production.
        env:
          RDRS_FAST_HASH: "1"
        run: cargo llvm-cov nextest --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: henry40408/rdrs
          files: lcov.info
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}

  lint-workflow:
    name: lint-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install-action has no actionlint manifest, so download the release and
      # verify its checksum.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" actionlint
      - run: ./actionlint
