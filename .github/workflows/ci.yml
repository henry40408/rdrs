name: CI

on:
  push:
    branches: [main, fix/mutation-gate-shards] # TEMP: verify the push path
  pull_request:
    branches: [main]

# One run per ref at a time — a newer push supersedes the run it interrupted.
# No tag carve-out here (unlike Docker, which publishes on `v*`): this workflow
# has no tag trigger, so `github.ref` is never a tag and the guard was dead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job writes to the repository, so the token stays read-only.
permissions:
  contents: read

jobs:
  # The licence allow-list is enforced with go-licenses.
  deps:
    name: deps
    runs-on: ubuntu-latest
    env:
      # The root module allows only these. `e2e/` additionally allows MPL-2.0
      # (godog pulls in go-immutable-radix, go-memdb and golang-lru); MPL-2.0
      # must not reach the root module, which ships in the image.
      ALLOWED_LICENSES: Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MIT-0,Zlib,Unlicense,CC0-1.0,Unicode-3.0,BSL-1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: |
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # go-licenses needs GOROOT set explicitly, else it fails on the standard
      # library with "does not have module info". The module's own LICENSE is
      # not a dependency, so it is ignored.
      - run: |
          GOROOT="$(go env GOROOT)" go run github.com/google/go-licenses/v2@v2.0.1 check ./... \
            --include_tests --ignore github.com/henry40408/rdrs \
            --allowed_licenses="$ALLOWED_LICENSES"
      # `e2e/` is a separate Go module with its own vendor directory.
      - run: go mod tidy -diff
        working-directory: e2e
      - run: |
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
        working-directory: e2e
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: e2e
      # `--include_tests` because the Gherkin and browser libraries are test
      # dependencies of this module.
      - run: |
          GOROOT="$(go env GOROOT)" go run github.com/google/go-licenses/v2@v2.0.1 check ./... \
            --include_tests --ignore github.com/henry40408/rdrs/e2e \
            --allowed_licenses="$ALLOWED_LICENSES,MPL-2.0"
        working-directory: e2e

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          unformatted="$(git ls-files -z '*.go' | grep -zvE '(^|/)vendor/' | xargs -0 gofmt -l 2>&1)"
          echo "$unformatted"
          test -z "$unformatted"
      - run: go vet -mod=vendor ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go vet -mod=vendor ./...
        working-directory: e2e
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
        working-directory: e2e
      # CI and the Dockerfile read the Go version from the root go.mod only, so
      # the nested module must not drift from it.
      - run: |
          root="$(grep -E '^(go|toolchain) ' go.mod)"
          nested="$(grep -E '^(go|toolchain) ' e2e/go.mod)"
          test "$root" = "$nested" || { echo "e2e/go.mod differs from go.mod:"; echo "$root"; echo "--"; echo "$nested"; exit 1; }

  # RDRS_FAST_HASH swaps Argon2 to minimal cost params for the test runs only:
  # the tests register and log in hundreds of times. Never set in production.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -mod=vendor -race ./...
        env:
          RDRS_FAST_HASH: "1"

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rdrs
          POSTGRES_PASSWORD: rdrs
          POSTGRES_DB: rdrs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rdrs -d rdrs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # One package at a time: the packages share one database.
      - run: go test -mod=vendor -p 1 -count=1 ./...
        env:
          RDRS_FAST_HASH: "1"
          TEST_DATABASE_URL: postgres://rdrs:rdrs@localhost:5432/rdrs

  # Pushes to main mutate the whole module, split into shards that run on their
  # own runners (the whole module takes over two hours of runner time, and
  # the unsharded job was killed mid-run); pull requests mutate only the lines
  # changed against the base branch. The efficacy threshold and the `e2e/` and
  # `vendor/` exclusions live in .gremlins.yaml: gremlins v0.6.0 ignores
  # `--threshold-efficacy` on the command line, so never pass it here.
  #
  # gremlins `unleash` takes one path, so every shard runs `.` and
  # `--exclude-files` drops the files outside its slice (RE2 has no lookahead,
  # so each entry lists the complement). The slices are disjoint and add up to
  # the whole module: `unleash --dry-run` on each reports 268 + 261 + 252 + 418
  # + 664 + 822 + 781 = 3466 runnable mutants, the same as the unsharded module.
  # `internal/server` is split by file into four shards because its tests are
  # the slowest: a mutant there costs 5-6 s, one elsewhere under 1 s.
  # `--exclude-files` replaces the list in .gremlins.yaml, so `e2e/` and
  # `vendor/` are repeated in every entry.
  mutation-shard:
    name: mutation-shard (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: server-accounts
            exclude: '^(e2e|vendor|cmd)/|^internal/(audit|auth|cache|config|datetime|db|discovery|events|feedparse|feedsync|fetch|flash|greader|han|htmldepth|icon|imageproxy|migrate|models|opml|pixel|readability|sanitize|save|search|secret|siphash|summarize|testutil|textutil|timezone|version|views|worker|zxcvbn)/|^internal/server/(chrome\.go|invite\.go|returnto\.go|routes\.go|summarizer\.go|timefmt\.go|entries_query\.go|entries_rows\.go|entries\.go|entry_actions\.go|entry_api\.go|entry_fragments\.go|entry_pane\.go|mark_read\.go|media\.go|search_text\.go|search\.go|statistics\.go|feeds\.go|greader_auth\.go|greader_stream\.go|greader_subscription\.go|greader_tag\.go|greader_user\.go)|^internal/server/middleware/'
          - name: server-pages
            exclude: '^(e2e|vendor|cmd)/|^internal/(audit|auth|cache|config|datetime|db|discovery|events|feedparse|feedsync|fetch|flash|greader|han|htmldepth|icon|imageproxy|migrate|models|opml|pixel|readability|sanitize|save|search|secret|siphash|summarize|testutil|textutil|timezone|version|views|worker|zxcvbn)/|^internal/server/(account\.go|admin\.go|app\.go|auth_handlers\.go|categories\.go|errors\.go|events\.go|httpio\.go|page\.go|passkey\.go|static\.go|entry_fragments\.go|entry_pane\.go|mark_read\.go|media\.go|search_text\.go|search\.go|statistics\.go|feeds\.go|greader_auth\.go|greader_stream\.go|greader_subscription\.go|greader_tag\.go|greader_user\.go)|^internal/server/middleware/'
          - name: server-entries
            exclude: '^(e2e|vendor|cmd)/|^internal/(audit|auth|cache|config|datetime|db|discovery|events|feedparse|feedsync|fetch|flash|greader|han|htmldepth|icon|imageproxy|migrate|models|opml|pixel|readability|sanitize|save|search|secret|siphash|summarize|testutil|textutil|timezone|version|views|worker|zxcvbn)/|^internal/server/(account\.go|admin\.go|app\.go|auth_handlers\.go|categories\.go|errors\.go|events\.go|httpio\.go|page\.go|passkey\.go|static\.go|chrome\.go|invite\.go|returnto\.go|routes\.go|summarizer\.go|timefmt\.go|entries_query\.go|entries_rows\.go|entries\.go|entry_actions\.go|entry_api\.go|feeds\.go|greader_auth\.go|greader_stream\.go|greader_subscription\.go|greader_tag\.go|greader_user\.go)|^internal/server/middleware/'
          - name: server-feeds-greader
            exclude: '^(e2e|vendor|cmd)/|^internal/(audit|auth|cache|config|datetime|db|discovery|events|feedparse|feedsync|fetch|flash|greader|han|htmldepth|icon|imageproxy|migrate|models|opml|pixel|readability|sanitize|save|search|secret|siphash|summarize|testutil|textutil|timezone|version|views|worker|zxcvbn)/|^internal/server/(account\.go|admin\.go|app\.go|auth_handlers\.go|categories\.go|errors\.go|events\.go|httpio\.go|page\.go|passkey\.go|static\.go|chrome\.go|invite\.go|returnto\.go|routes\.go|summarizer\.go|timefmt\.go|entries_query\.go|entries_rows\.go|entries\.go|entry_actions\.go|entry_api\.go|entry_fragments\.go|entry_pane\.go|mark_read\.go|media\.go|search_text\.go|search\.go|statistics\.go)'
          - name: models
            exclude: '^(e2e|vendor|cmd)/|^internal/(audit|auth|cache|config|datetime|discovery|events|feedparse|feedsync|fetch|flash|greader|han|htmldepth|icon|imageproxy|opml|pixel|readability|sanitize|save|search|secret|server|siphash|summarize|testutil|textutil|timezone|version|views|worker|zxcvbn)/'
          - name: content
            exclude: '^(e2e|vendor|cmd)/|^internal/(audit|auth|cache|config|datetime|db|events|flash|greader|han|migrate|models|search|secret|server|siphash|summarize|testutil|textutil|timezone|version|views|worker|zxcvbn)/'
          - name: misc
            exclude: '^(e2e|vendor)/|^internal/(db|discovery|feedparse|feedsync|fetch|htmldepth|icon|imageproxy|migrate|models|opml|pixel|readability|sanitize|save|server)/'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `--diff` needs the base branch's history, not a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Gremlins derives each mutant's timeout from how long its coverage run
      # took. A cached test result makes that near zero, so nearly every mutant
      # "times out", which the efficacy score ignores: the job would pass
      # without testing anything.
      - run: go clean -testcache
      # Never pass `--test-cpu`: gremlins v0.6.0 builds a single `-cpu 2`
      # argument from it, so every mutant's `go test` fails and counts as
      # killed, and the gate passes without testing anything. GOMAXPROCS limits
      # the CPUs instead.
      - name: Mutate the shard (push)
        if: github.event_name != 'pull_request'
        env:
          GOMAXPROCS: "2"
          RDRS_FAST_HASH: "1"
          SHARD_EXCLUDE: ${{ matrix.shard.exclude }}
        run: |
          # A mutant can turn a loop into one that never ends and keeps
          # allocating (the parser's `p.pos++` flipped to `p.pos--` in
          # internal/search). Memory ran out before gremlins' timeout fired, and
          # the runner was killed with SIGTERM. The address-space limit makes
          # such a test process crash instead, which counts as a killed mutant.
          ulimit -v 4194304
          set -o pipefail
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash \
            --workers 2 --exclude-files "$SHARD_EXCLUDE" . 2>&1 | tee "$RUNNER_TEMP/mutation.log"
      - name: Mutate the changed lines of the shard (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          GOMAXPROCS: "2"
          RDRS_FAST_HASH: "1"
          SHARD_EXCLUDE: ${{ matrix.shard.exclude }}
        run: |
          # Stream the output so a killed runner still leaves a log. Capping
          # workers and CPUs per test run keeps a whole-module diff within the
          # runner's resources: the default (one worker per CPU) was killed
          # with SIGTERM.
          status=0
          ulimit -v 4194304 # see the push step
          set -o pipefail
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash \
            --workers 2 --exclude-files "$SHARD_EXCLUDE" \
            --diff "origin/$BASE_REF" . 2>&1 | tee "$RUNNER_TEMP/mutation.log" || status=$?
          set +o pipefail
          # A shard whose diff has no mutable Go line (docs, CI only, or other
          # shards' files) yields zero mutants, which gremlins scores as 0% and
          # so fails the threshold. That is not a low score, so treat it as a
          # pass.
          if [ "$status" -ne 0 ] \
            && grep -q '^Killed: 0, Lived: 0, Not covered: 0$' "$RUNNER_TEMP/mutation.log" \
            && grep -q '^Timed out: 0, ' "$RUNNER_TEMP/mutation.log"; then
            echo "No mutants in the changed lines; nothing to test."
            exit 0
          fi
          exit "$status"
      - name: Upload the mutation log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.shard.name }}
          path: ${{ runner.temp }}/mutation.log
          if-no-files-found: ignore

  # The one required check: branch protection names `mutation`, so shards can
  # be added or renamed without touching it. `always()` makes it run (and fail)
  # when a shard fails or is cancelled instead of being skipped.
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    needs: mutation-shard
    if: always()
    steps:
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.mutation-shard.result }}
        run: |
          echo "mutation shards: $SHARDS_RESULT"
          [ "$SHARDS_RESULT" = success ]

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -mod=vendor -coverpkg=./... -coverprofile=coverage.out ./...
        env:
          RDRS_FAST_HASH: "1"
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: henry40408/rdrs
          files: coverage.out
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}

  # The browser suite: godog + chromedp, driving the runner's Chrome.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so the VCS-stamped version resolves
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Prebuild the server the suite launches, keeping the compile off its
      # timeout.
      - run: go build -mod=vendor -o bin/rdrs ./cmd/rdrs
      # The runner ships Chrome; chromedp starts it itself, so no driver is needed.
      # Pinned, because chromedp's own search would pick the runner's Chromium
      # snapshot ahead of google-chrome.
      - run: google-chrome --version
      - run: go test -mod=vendor -count=1 -v -timeout 25m ./...
        working-directory: e2e
        env:
          E2E_CHROME: /usr/bin/google-chrome
      - run: go run -mod=vendor ./cmd/cspaudit
        working-directory: e2e
        env:
          E2E_CHROME: /usr/bin/google-chrome
      - run: go run -mod=vendor ./cmd/nojs
        working-directory: e2e
        env:
          E2E_CHROME: /usr/bin/google-chrome

  lint-workflow:
    name: lint-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install-action has no actionlint manifest, so download the release and
      # verify its checksum.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" actionlint
      - run: ./actionlint
