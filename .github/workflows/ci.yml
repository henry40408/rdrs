name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

# One run per ref at a time — a newer push supersedes the run it interrupted.
# No tag carve-out here (unlike Docker, which publishes on `v*`): this workflow
# has no tag trigger, so `github.ref` is never a tag and the guard was dead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fmt + clippy on Linux. Runs in parallel with everything else — no gating.
  # GitHub Actions caches aren't shared across jobs, so a "lint gate" can't hand
  # its compiled artifacts to downstream jobs; it would only serialize a second
  # compile onto the critical path for no wall-clock win. And the cheap checks
  # (fmt, deny) don't validate compilation anyway, so they make poor fail-fast
  # gates for a Rust project. Full parallelism is simplest and fastest.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # clippy compiles, and build.rs runs git describe

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  # Cross-platform build / portability check (build-only; fmt + clippy live in
  # the lint job). macOS is a portability sanity check; RDRS deploys to Linux
  # servers. (Windows was dropped earlier: 5-9 min per PR for no deployment
  # value.)
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Fetch full history for git describe

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build
        run: cargo build --verbose

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: cargo-deny@0.18.9
      - name: cargo deny check
        run: cargo deny check

  # PostgreSQL backend integration test. The default nextest run (lint/coverage)
  # only exercises the SQLite backend; this job stands up a throwaway Postgres
  # and runs the dual-backend dialect-fork test (`tests/postgres_test.rs`)
  # against it. Gated by TEST_DATABASE_URL — without it the test skips.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rdrs
          POSTGRES_PASSWORD: rdrs
          POSTGRES_DB: rdrs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rdrs -d rdrs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: nextest

      - name: Run Postgres integration test
        env:
          RDRS_FAST_HASH: "1"
          TEST_DATABASE_URL: postgres://rdrs:rdrs@localhost:5432/rdrs
        run: cargo nextest run --test postgres_test

  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build binary
        run: cargo build

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the full e2e lockfile so any change to @playwright/test
          # (or its transitive playwright-core) forces a clean re-download
          # rather than restoring a mismatched browser build.
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}

      # On a cache hit the browser binaries are restored; only the apt-level
      # system libraries still need installing. On a miss, download both.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium

      # playwright-bdd generates the runnable specs from the .feature files into
      # .features-gen/, which is git-ignored. Auto-generation on `playwright
      # test` does not fire here because the project sets its own `globalSetup`
      # (to build the binary), shadowing playwright-bdd's generation hook — so a
      # fresh checkout has no specs and `playwright test` would silently run zero
      # tests and pass. Generate them explicitly first.
      - name: Generate BDD specs
        working-directory: e2e
        run: npx bddgen

      - name: Run E2E tests (shard ${{ matrix.shard }})
        working-directory: e2e
        run: npx playwright test --shard=${{ matrix.shard }} --grep-invert "@skip"

      # Browser-level CSP check. It lives here rather than in its own job so it
      # inherits the Rust build, npm install and Playwright browsers this job has
      # already paid for; a standalone job would repeat all three to run a single
      # ~10s spec. Pinned to one shard because the audit walks the whole app
      # itself — running it three times would only triple the cost.
      #
      # This complements, not duplicates, the static scan in
      # `src/middleware/security_headers.rs`: that one greps the sources for
      # inline styles and handlers, while this one enforces the policy the
      # browser actually applies (runtime-injected markup, shadow DOM, webfonts,
      # cross-origin @import). The spec carries its own positive control, so a
      # pass means the collector was demonstrably live.
      - name: CSP audit
        if: matrix.shard == '1/3'
        working-directory: e2e
        run: npm run test:csp

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: e2e/playwright-report/
          retention-days: 14

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # cargo-llvm-cov installs the llvm-tools-preview component itself, so the
      # toolchain needs no extra declaration beyond rust-toolchain.toml.

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: cargo-llvm-cov

      - uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: nextest

      - name: Generate coverage
        # RDRS_FAST_HASH swaps Argon2 to minimal cost params for this run only.
        # The integration tests register/log in hundreds of times; with the
        # production (memory-hard) params each hash costs ~hundreds of ms in a
        # debug build, dominating the suite. Never set in production.
        env:
          RDRS_FAST_HASH: "1"
        run: cargo llvm-cov nextest --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: henry40408/rdrs
          files: lcov.info
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}
