<!DOCTYPE html>
<html lang="en"{% if let Some(t) = theme %} data-theme="{{ t }}"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,300;1,8..60,400;1,8..60,500;1,8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css?v={{ git_version }}">
    <script>
        window.theme = {
            syncToServer: async function(theme) {
                try {
                    await fetch('/api/user/settings/theme', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ theme: theme === 'system' ? null : theme })
                    });
                } catch (e) { /* silent fail */ }
            }
        };

        window.setupPersistedRestore = function(loadFn, getEntries, selectFn) {
            window.onPersistedPageShow = async function() {
                const idx = window._resumeIndex;
                window._resumeIndex = undefined;
                await loadFn();
                const items = getEntries();
                if (idx !== undefined && items.length > 0) {
                    selectFn(Math.min(idx, items.length - 1));
                }
            };
        };

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.querySelector('.sidebar-toggle');
            if (sidebar) {
                sidebar.classList.toggle('open');
                if (toggle) toggle.style.display = sidebar.classList.contains('open') ? 'none' : '';
            }
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.querySelector('.sidebar-toggle');
            if (sidebar) sidebar.classList.remove('open');
            if (toggle) toggle.style.display = '';
        }
    </script>
    <script type="module" src="/static/js/components/rdrs-kb-pending.js?v={{ git_version }}"></script>
    <script type="module" src="/static/js/components/rdrs-flash.js?v={{ git_version }}"></script>
    <script type="module" src="/static/js/components/rdrs-kb-help.js?v={{ git_version }}"></script>
    <script type="module" src="/static/js/components/rdrs-sidebar.js?v={{ git_version }}"></script>
    <script type="module" src="/static/js/keyboard.js?v={{ git_version }}"></script>
    <script type="module" src="/static/js/components/rdrs-entry-list.js?v={{ git_version }}"></script>
    <script type="module" src="{{ script_path }}?v={{ git_version }}"></script>
    <script type="module" src="/static/js/router.js?v={{ git_version }}"></script>
</head>
<body>
    <script type="application/json" id="rdrs-sidebar-bootstrap">{{ sidebar_bootstrap_json|safe }}</script>
    <script type="application/json" id="rdrs-flash-bootstrap">{{ flash_bootstrap_json|safe }}</script>
    <div class="app-layout">
        <rdrs-sidebar></rdrs-sidebar>
        <main class="main-content" id="page-host"><{{ element_tag }}></{{ element_tag }}></main>
    </div>
    <rdrs-kb-help></rdrs-kb-help>
    <rdrs-kb-pending></rdrs-kb-pending>
    <script>
        window.addEventListener('pageshow', function(event) {
            if (event.persisted && typeof window.onPersistedPageShow === 'function') {
                window.onPersistedPageShow();
            }
        });
    </script>
</body>
</html>
