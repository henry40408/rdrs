<!DOCTYPE html>
<html lang="en"{% block html_attrs %}{% endblock %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RDRS{% endblock %}</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
        :root {
            --space-1: 0.25rem;   /* 4px */
            --space-2: 0.5rem;    /* 8px */
            --space-3: 0.75rem;   /* 12px */
            --space-4: 1rem;      /* 16px */
            --space-5: 1.25rem;   /* 20px */
            --space-6: 1.5rem;    /* 24px */
            --space-8: 2rem;      /* 32px */
            --space-16: 4rem;     /* 64px */

            /* Font sizes */
            --font-xs: 0.75rem;    /* 12px */
            --font-sm: 0.85rem;    /* ~13px */
            --font-base: 1rem;     /* 15px (body) */
            --font-lg: 1.1rem;     /* entry-item-title */
            --font-xl: 1.125rem;   /* entry content */

            /* Border radius */
            --radius-sm: 2px;
            --radius-md: 4px;

            /* Colors - Light theme */
            --color-bg: #ffffff;
            --color-bg-secondary: #f8f9fa;
            --color-bg-tertiary: #f5f5f5;
            --color-text: #111111;
            --color-text-muted: #666666;
            --color-border: #111111;
            --color-border-light: #dddddd;
            --color-accent: #0066cc;
            --color-success: #22863a;
            --color-error: #cc0000;
            --color-button-bg: #111111;
            --color-button-text: #ffffff;
            --color-overlay: rgba(0, 0, 0, 0.5);
            --color-highlight: #ffeb3b;
        }

        [data-theme="dark"] {
            --color-bg: #1a1a1a;
            --color-bg-secondary: #242424;
            --color-bg-tertiary: #2d2d2d;
            --color-text: #e5e5e5;
            --color-text-muted: #a3a3a3;
            --color-border: #404040;
            --color-border-light: #333333;
            --color-accent: #58a6ff;
            --color-success: #3fb950;
            --color-error: #f85149;
            --color-button-bg: #e5e5e5;
            --color-button-text: #1a1a1a;
            --color-overlay: rgba(0, 0, 0, 0.7);
            --color-highlight: #634d00;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme]) {
                --color-bg: #1a1a1a;
                --color-bg-secondary: #242424;
                --color-bg-tertiary: #2d2d2d;
                --color-text: #e5e5e5;
                --color-text-muted: #a3a3a3;
                --color-border: #404040;
                --color-border-light: #333333;
                --color-accent: #58a6ff;
                --color-success: #3fb950;
                --color-error: #f85149;
                --color-button-bg: #e5e5e5;
                --color-button-text: #1a1a1a;
                --color-overlay: rgba(0, 0, 0, 0.7);
                --color-highlight: #634d00;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            background-color: var(--color-bg);
            color: var(--color-text);
            padding: var(--space-8) var(--space-16);
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: var(--font-base);
            font-weight: normal;
            margin-bottom: var(--space-6);
            border-bottom: 1px solid var(--color-border);
            padding-bottom: var(--space-2);
        }
        h2 {
            font-size: var(--font-base);
            font-weight: bold;
            margin-top: var(--space-6);
            margin-bottom: var(--space-2);
        }
        h2 + p.muted {
            margin-top: 0;
            margin-bottom: var(--space-3);
        }
        h3 {
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: var(--space-4);
            margin-bottom: var(--space-1);
        }
        h3 + p.muted {
            margin-top: 0;
            margin-bottom: var(--space-2);
        }
        .form-group {
            margin-bottom: var(--space-4);
        }
        .form-group-inline {
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: var(--space-1);
        }
        input[type="text"],
        input[type="password"],
        input[type="url"],
        input[type="number"] {
            width: 100%;
            padding: var(--space-2);
            border: 1px solid var(--color-border);
            font-family: inherit;
            font-size: inherit;
            background: var(--color-bg);
            color: var(--color-text);
        }
        input:focus {
            outline: 2px solid var(--color-border);
            outline-offset: 1px;
        }
        select {
            width: 100%;
            padding: var(--space-2);
            border: 1px solid var(--color-border);
            font-family: inherit;
            font-size: inherit;
            background: var(--color-bg);
            color: var(--color-text);
        }
        select:focus {
            outline: 2px solid var(--color-border);
            outline-offset: 1px;
        }
        button, .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-md);
            background: var(--color-button-bg);
            color: var(--color-button-text);
            border: 1px solid var(--color-border);
            font-family: inherit;
            font-size: inherit;
            line-height: 1;
            cursor: pointer;
            text-decoration: none;
        }
        button:hover, .btn:hover {
            background: var(--color-bg);
            color: var(--color-text);
        }
        .btn-primary {
            background: var(--color-accent);
            color: #ffffff;
            border-color: var(--color-accent);
        }
        .btn-primary:hover {
            background: transparent;
            color: var(--color-accent);
        }
        .btn-secondary {
            background: transparent;
            color: var(--color-text);
            border-color: var(--color-text);
        }
        .btn-secondary:hover {
            background: var(--color-text);
            color: var(--color-bg);
        }
        .btn-danger {
            background: var(--color-error);
            color: #ffffff;
            border-color: var(--color-error);
        }
        .btn-danger:hover {
            background: transparent;
            color: var(--color-error);
        }
        .error {
            margin-bottom: var(--space-4);
        }
        .error::before {
            content: "ERROR — ";
        }
        a {
            color: var(--color-text);
        }
        a:hover {
            background: var(--color-text);
            color: var(--color-bg);
        }
        .link {
            margin-top: var(--space-6);
        }
        .flash-container {
            margin-bottom: var(--space-6);
        }
        .flash {
            margin-bottom: var(--space-2);
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }
        .flash-success::before { content: "OK — "; }
        .flash-error::before { content: "ERROR — "; }
        .flash-info::before { content: "INFO — "; }
        .flash-warning::before { content: "WARN — "; }
        .flash-close {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            margin: 0 0 0 var(--space-4);
            font-family: inherit;
            font-size: inherit;
            width: auto;
            color: var(--color-text-muted);
            text-decoration: none;
        }
        .flash-close:hover {
            background: none;
            color: var(--color-text);
            text-decoration: none;
        }
        .flash-right {
            margin-left: auto;
            white-space: nowrap;
        }
        .flash-time {
            color: var(--color-text-muted);
        }
        hr {
            border: none;
            border-top: 1px solid var(--color-border);
            margin: var(--space-6) 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: var(--space-4) 0;
        }
        th, td {
            text-align: left;
            padding: var(--space-1) var(--space-2);
            border-bottom: 1px solid var(--color-border-light);
        }
        td input[type="text"] {
            padding: 0;
            margin: 0;
            border: 1px solid var(--color-border);
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            height: auto;
        }
        th {
            border-bottom: 1px solid var(--color-border);
        }
        .actions {
            display: flex;
            gap: var(--space-2);
            flex-wrap: wrap;
        }
        .actions button, .actions .btn {
            padding: var(--space-1) var(--space-2);
            font-size: var(--font-xs);
        }
        .actions a {
            color: var(--color-accent);
            text-decoration: none;
            padding: var(--space-1) var(--space-2);
            border-radius: var(--radius-sm);
            font-size: var(--font-sm);
        }
        .actions a:hover {
            background: var(--color-accent);
            color: #ffffff;
        }
        .actions a[onclick*="delete"] {
            color: var(--color-error);
        }
        .actions a[onclick*="delete"]:hover {
            background: var(--color-error);
            color: #ffffff;
        }
        .badge {
            font-size: var(--font-xs);
        }
        .muted {
            color: var(--color-text-muted);
        }
        .success-text {
            color: var(--color-success);
        }
        .error-text {
            color: var(--color-error);
        }
        /* Filter bar */
        .filter-bar {
            display: flex;
            gap: var(--space-4);
            flex-wrap: wrap;
            align-items: flex-end;
            margin-bottom: var(--space-4);
        }
        /* Entry item */
        .entry-item {
            margin-bottom: var(--space-3);
            padding-bottom: var(--space-3);
            border-bottom: 1px solid var(--color-border-light);
        }
        .entry-item-title {
            font-size: var(--font-lg);
        }
        .entry-item-meta {
            font-size: var(--font-sm);
            margin-top: var(--space-1);
        }
        .entry-item-actions {
            margin-top: var(--space-2);
            font-size: var(--font-sm);
            display: flex;
            gap: var(--space-3);
        }
        .entry-item-actions a {
            color: var(--color-accent);
            text-decoration: none;
            border-radius: var(--radius-sm);
        }
        .entry-item-actions a:hover {
            background: var(--color-accent);
            color: #ffffff;
            box-shadow: 0 0 0 3px var(--color-accent);
        }
        /* Dialog (native modal) */
        dialog {
            margin: auto;
            background: var(--color-bg);
            color: var(--color-text);
            max-width: 600px;
            width: calc(100% - var(--space-8));
            padding: var(--space-8);
            border: 1px solid var(--color-border);
            font-family: inherit;
            font-size: inherit;
        }
        dialog::backdrop {
            background: var(--color-overlay);
        }
        .modal-title {
            font-size: 1rem;
            font-weight: normal;
            margin-bottom: var(--space-4);
            border-bottom: 1px solid var(--color-border);
            padding-bottom: var(--space-2);
        }
        .modal-actions {
            display: flex;
            gap: var(--space-2);
            margin-top: var(--space-4);
        }
        /* Settings table header */
        .settings-th {
            text-align: left;
            padding-right: var(--space-8);
        }
        /* Utilities */
        .d-none {
            display: none;
        }
        .ml-auto {
            margin-left: auto;
        }
        .hidden-mt4 {
            display: none;
            margin-top: var(--space-4);
        }
        .entry-read {
            opacity: 0.6;
        }
        .entry-title-bold {
            font-weight: bold;
        }
        .entry-title-normal {
            font-weight: normal;
        }
        .content-snippet {
            font-size: 0.8rem;
            margin-top: var(--space-1);
            font-style: italic;
        }
        .feeds-toolbar {
            display: flex;
            gap: var(--space-4);
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: var(--space-4);
        }
        .feed-edit-url-row {
            display: flex;
            gap: var(--space-2);
        }
        .feed-edit-url-row input {
            flex: 1;
        }
        .feed-edit-url-row button {
            white-space: nowrap;
        }
        .feed-http-settings {
            margin-top: var(--space-4);
            border: 1px solid var(--color-border-light);
            padding: var(--space-2);
        }
        .feed-http-settings-body {
            margin-top: var(--space-2);
        }
        .feed-http-hint {
            font-size: var(--font-xs);
            color: var(--color-text-muted);
        }
        .feed-error-no-border {
            border-bottom: none;
        }
        .feed-error-cell {
            font-size: 0.875rem;
            padding-top: 0;
        }
        nav {
            margin-bottom: var(--space-6);
            padding-bottom: var(--space-2);
            border-bottom: 1px solid var(--color-border);
        }
        nav ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-4);
        }
        nav a {
            text-decoration: none;
        }
        nav a.active {
            font-weight: bold;
        }
        @media (max-width: 768px) {
            body {
                padding: var(--space-4);
            }
            .entry-item {
                margin-bottom: var(--space-3);
                padding-bottom: var(--space-2);
            }
            .entry-item-title {
                font-size: var(--font-base);
            }
            .entry-item-meta {
                font-size: 0.8rem;
            }
            .entry-item-actions {
                margin-top: var(--space-1);
                font-size: 0.8rem;
            }
        }
        .feed-icon {
            width: 16px;
            height: 16px;
            vertical-align: middle;
            margin-right: var(--space-1);
            border-radius: var(--radius-sm);
            background: #ffffff;
        }
        /* Selected entry highlight */
        .entry-item.selected {
            background: var(--color-bg-tertiary);
            outline: 2px solid var(--color-border);
            outline-offset: -2px;
            margin-left: calc(-1 * var(--space-2));
            margin-right: calc(-1 * var(--space-2));
            padding-left: var(--space-2);
            padding-right: var(--space-2);
        }
        /* Search highlight */
        .search-highlight {
            background-color: var(--color-highlight);
            color: var(--color-text);
            padding: 0 var(--radius-sm);
            border-radius: var(--radius-sm);
        }
        /* Summary badges */
        .summary-badge {
            color: var(--color-accent);
            font-weight: normal;
            margin-left: var(--space-1);
        }
        .summary-badge-pending {
            color: var(--color-text-muted);
            font-weight: normal;
            margin-left: var(--space-1);
        }
        .summary-badge-processing {
            color: var(--color-accent);
            font-weight: normal;
            margin-left: var(--space-1);
            animation: blink 1s infinite;
        }
        .summary-badge-failed {
            color: var(--color-error);
            font-weight: normal;
            margin-left: var(--space-1);
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        /* Entries count spacing */
        #entries-count {
            margin-top: var(--space-4); /* 1rem / 16px */
        }
    </style>
    <script>
        // Theme controller
        window.theme = {
            // Save to server
            syncToServer: async function(theme) {
                try {
                    await fetch('/api/user/settings/theme', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ theme: theme === 'system' ? null : theme })
                    });
                } catch (e) { /* silent fail */ }
            }
        };

        // Helper for pages to set up bfcache restore behavior.
        // Defined in <head> so child templates can call it during their script execution.
        window.setupPersistedRestore = function(loadFn, getEntries, selectFn) {
            window.onPersistedPageShow = async function() {
                const idx = window._resumeIndex;
                window._resumeIndex = undefined;
                await loadFn();
                const items = getEntries();
                if (idx !== undefined && items.length > 0) {
                    selectFn(Math.min(idx, items.length - 1));
                }
            };
        };
    </script>
    <script type="module" src="/static/js/components/rdrs-loading-bar.js?v={{ git_version }}"></script>
    <script type="module" src="/static/js/components/rdrs-kb-pending.js?v={{ git_version }}"></script>
    <script type="module" src="/static/js/components/rdrs-flash.js?v={{ git_version }}"></script>
    <script type="module" src="/static/js/components/rdrs-kb-help.js?v={{ git_version }}"></script>
    <script type="module" src="/static/js/keyboard.js?v={{ git_version }}"></script>
    <script type="module" src="/static/js/components/rdrs-entry-list.js?v={{ git_version }}"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <rdrs-loading-bar></rdrs-loading-bar>
    {% block flash %}{% endblock %}
    {% block content %}{% endblock %}
    <rdrs-kb-help></rdrs-kb-help>
    <rdrs-kb-pending></rdrs-kb-pending>
    <script>
        // Refresh page content when restored from bfcache
        window.addEventListener('pageshow', function(event) {
            if (event.persisted && typeof window.onPersistedPageShow === 'function') {
                window.onPersistedPageShow();
            }
        });
    </script>
</body>
</html>
