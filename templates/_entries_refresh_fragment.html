{# Scoped-search response: replaces the entries list and the mark-matching slot,
   leaving the header (and the focused search input) untouched. #}
<template data-swap-target="[data-entries-list]">
<div class="list-pane-body" data-entries-list data-snapshot-at="{{ entries_layout.snapshot_at }}">
{% include "_entries_list_body.html" %}
</div>
</template>
<template data-swap-target="[data-search-error]">
<div class="search-error search-drawer-error" role="alert" data-search-error data-testid="scoped-search-error"{% if entries_layout.search_error.is_none() %} hidden{% endif %}>{% if let Some(err) = entries_layout.search_error.as_ref() %}{{ err }}{% endif %}</div>
</template>
<template data-swap-target="[data-mark-matching-slot]">
<span class="mark-matching-slot" data-mark-matching-slot>{% include "_mark_matching_button.html" %}</span>
</template>
