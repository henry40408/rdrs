{% extends "base.html" %}
{% import "macros.html" as macros %}

{% block title %}Register - RDRS{% endblock %}

{% block body %}
<div class="auth-layout">
    <div class="auth-card">
        {% call macros::flash(flash_messages) %}{% endcall %}
        <h1>rdrs</h1>
        {% if let Some(err) = error %}
        <div class="error">{{ err }}</div>
        {% else %}
        <div id="error" class="error" style="display: none;" data-testid="register-error"></div>
        <form id="register-form" data-testid="register-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username" data-testid="register-username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" data-testid="register-password">
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required minlength="6" autocomplete="new-password" data-testid="register-confirm-password">
            </div>
            <button type="submit" class="btn-block" data-testid="register-submit">Create Account</button>
        </form>
        {% endif %}
        <div class="link">
            <a href="/login">Already have an account? Sign in</a>
        </div>
    </div>
</div>
<script>
    const form = document.getElementById('register-form');
    if (form) {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    flash.redirect('/login', 'success', 'Registration successful! Please login.');
                } else {
                    const data = await response.json();
                    errorDiv.textContent = data.error || 'Registration failed';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'An error occurred. Please try again.';
                errorDiv.style.display = 'block';
            }
        });
    }
</script>
{% endblock %}
