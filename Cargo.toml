[package]
name = "rdrs"
version = "0.1.0"
edition = "2024"
description = "RSS Reader in Rust"

[lib]
name = "rdrs"
path = "src/lib.rs"

[[bin]]
name = "rdrs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "time",
  "net",
  "signal",
  "sync",
] }
tokio-util = { version = "0.7", features = ["rt"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "postgres",
  "chrono",
  "derive",
  "macros",
  "migrate",
] }
askama = "0.16"
argon2 = "0.5"
password-hash = { version = "0.6", features = ["getrandom"] }
# rand_core 0.6 is declared directly to enable its `getrandom` feature, which
# provides `OsRng` for password-hash's rand_core (a different major than rand's).
# It has no direct code references by design — do not remove.
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.10"
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "timeout"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dateparser = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive", "env"] }
axum-extra = { version = "0.12", features = ["cookie"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "charset",
  "http2",
  "json",
] }
feed-rs = "2.1"
scraper = "0.27"
url = "2"
quick-xml = { version = "0.41", features = ["serialize"] }
ammonia = "4"
readability = { version = "0.3", default-features = false }
base64 = "0.23"
hmac = "0.13"
ipnet = "2.12"
sha2 = "0.11"
webauthn-rs = { version = "0.5", features = [
  "danger-allow-state-serialisation",
  # Passkey sign-in is usernameless: the challenge carries no
  # `allowCredentials`, so the browser must discover the credential itself.
  # This feature is what exposes that flow (`start_discoverable_authentication`
  # and friends) — see `handlers::passkey`.
  "conditional-ui",
] }
# Already in the tree under webauthn-rs; named directly only to reach
# `ResidentKeyRequirement`, which `webauthn_rs::prelude` does not re-export.
webauthn-rs-proto = "0.5"
# Password-strength estimation for new credentials. `default-features = false`
# drops the `builder` feature, which exists only for constructing the crate's
# options struct and would pull derive_builder + syn into the tree for nothing.
zxcvbn = { version = "3", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
openssl = { version = "0.10", features = ["vendored"] }
moka = { version = "0.12", features = ["sync"] }
time = "0.3"
hex = "0.4.3"
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }
lol_html = "3.0.0"
# Already linked in via lol_html / quick-xml / reqwest; declared directly so
# `utils::han` can use the GBK and Big5 encoders to tell Simplified Chinese
# apart from Traditional. Adds no weight to the binary.
encoding_rs = "0.8"
async-stream = "0.3"
tokio-stream = "0.1"

[build-dependencies]
resvg = "0.48"
image = "0.25"
ico = "0.5"

[dev-dependencies]
axum-test = "21"
cookie = "0.18"
image = "0.25"
tempfile = "3.26.0"
http-body-util = "0.1"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
# Self-maintained lint set (originally seeded from Embark Studios' rust-ecosystem
# list). The bulk of the old itemised pedantic lints are now covered by the
# `pedantic` group; only the noisy/low-signal ones are opted back out, plus the
# restriction and nursery lints that have no safe umbrella group.
[lints.rust]
unexpected_cfgs = "deny"
unsafe_code = "deny"

[lints.clippy]
# Groups (priority -1 so the individual entries below win).
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Opt out of the noisy / low-signal pedantic lints.
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
duration_suboptimal_units = "allow"
items_after_statements = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"

# Restriction lints (no safe umbrella group — kept itemised).
dbg_macro = "warn"
exit = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_add = "warn"
todo = "warn"
unimplemented = "warn"
verbose_file_reads = "warn"

# Nursery picks (the nursery group as a whole is too unstable to enable).
debug_assert_with_mut_call = "warn"
fallible_impl_from = "warn"
trait_duplication_in_bounds = "warn"
