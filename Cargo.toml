[package]
name = "rdrs"
version = "0.1.0"
edition = "2021"
description = "RSS Reader in Rust"

[lib]
name = "rdrs"
path = "src/lib.rs"

[[bin]]
name = "rdrs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "time",
  "net",
  "signal",
  "sync",
] }
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = { version = "0.40", features = ["bundled"] }
askama = "0.16"
argon2 = "0.5"
password-hash = { version = "0.6", features = ["getrandom"] }
# rand_core 0.6 is declared directly to enable its `getrandom` feature, which
# provides `OsRng` for password-hash's rand_core (a different major than rand's).
# It has no direct code references by design — do not remove.
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.10"
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "timeout"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dateparser = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum-extra = { version = "0.12", features = ["cookie"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "charset",
  "http2",
  "json",
] }
feed-rs = "2.1"
scraper = "0.27"
url = "2"
quick-xml = { version = "0.40", features = ["serialize"] }
ammonia = "4"
readability = { version = "0.3", default-features = false }
base64 = "0.22"
hmac = "0.13"
sha2 = "0.11"
webauthn-rs = { version = "0.5", features = [
  "danger-allow-state-serialisation",
] }
uuid = { version = "1", features = ["v4", "serde"] }
openssl = { version = "0.10", features = ["vendored"] }
moka = { version = "0.12", features = ["sync"] }
time = "0.3"
hex = "0.4.3"
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }
lol_html = "3.0.0"

[build-dependencies]
resvg = "0.47"
image = "0.25"
ico = "0.5"

[dev-dependencies]
axum-test = "20"
cookie = "0.18"
tempfile = "3.26.0"
http-body-util = "0.1"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
