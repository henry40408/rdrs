[package]
name = "rdrs"
version = "0.1.0"
edition = "2024"
description = "RSS Reader in Rust"

[lib]
name = "rdrs"
path = "src/lib.rs"

[[bin]]
name = "rdrs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "time",
  "net",
  "signal",
  "sync",
] }
tokio-util = { version = "0.7", features = ["rt"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "postgres",
  "chrono",
  "derive",
  "macros",
  "migrate",
] }
askama = "0.16"
argon2 = "0.5"
password-hash = { version = "0.6", features = ["getrandom"] }
# rand_core 0.6 is declared directly to enable its `getrandom` feature, which
# provides `OsRng` for password-hash's rand_core (a different major than rand's).
# It has no direct code references by design — do not remove.
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.10"
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "timeout"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dateparser = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive", "env"] }
axum-extra = { version = "0.12", features = ["cookie"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "charset",
  "http2",
  "json",
] }
feed-rs = "2.1"
scraper = "0.27"
url = "2"
quick-xml = { version = "0.40", features = ["serialize"] }
ammonia = "4"
readability = { version = "0.3", default-features = false }
base64 = "0.22"
hmac = "0.13"
ipnet = "2.12"
sha2 = "0.11"
webauthn-rs = { version = "0.5", features = [
  "danger-allow-state-serialisation",
] }
uuid = { version = "1", features = ["v4", "serde"] }
openssl = { version = "0.10", features = ["vendored"] }
moka = { version = "0.12", features = ["sync"] }
time = "0.3"
hex = "0.4.3"
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }
lol_html = "3.0.0"
async-stream = "0.3"
tokio-stream = "0.1"

[build-dependencies]
resvg = "0.47"
image = "0.25"
ico = "0.5"

[dev-dependencies]
axum-test = "20"
cookie = "0.18"
image = "0.25"
tempfile = "3.26.0"
http-body-util = "0.1"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
# https://github.com/EmbarkStudios/rust-ecosystem/blob/732513edfd9172f4eda358b2d0cefc6cad1585ee/lints.rs
[lints.rust]
unexpected_cfgs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = "warn"
await_holding_lock = "warn"
char_lit_as_u8 = "warn"
checked_conversions = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
from_iter_instead_of_collect = "warn"
if_let_mutex = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
let_unit_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
missing_enforced_import_renames = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
string_add = "warn"
string_add_assign = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
useless_transmute = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
